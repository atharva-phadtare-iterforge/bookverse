[project]
name = "bookverse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "atharva-phadtare-iterforge", email = "atharva.phadtare@iterforge.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.12",
    "pwdlib[argon2]>=0.3.1",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.3",
    "python-multipart>=0.0.32",
    "anyio>=4.14.2",
]

[project.scripts]
bookverse = "bookverse:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
