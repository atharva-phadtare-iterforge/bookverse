[project]
name = "bookverse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "atharva-phadtare-iterforge", email = "atharva.phadtare@iterforge.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "uvicorn>=0.52.3",
]

[project.scripts]
bookverse = "bookverse:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
